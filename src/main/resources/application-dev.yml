spring:
  config:
    import: optional:file:.env.dev[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/questiondb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:sokmeak1376}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Let Hibernate create the tables from the @Entity classes...
      ddl-auto: update
    # See the SQL Hibernate generates - very useful while learning.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
logging:
  level:
    root: INFO


jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdefxyz}
  issuer: quiz-simple-app
  expiration: 1h
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never # our GlobalExceptionHandler formats errors, not Spring

management:
  endpoints:
    web:
      exposure:
        include: health,info